# Essential utility with no custom MITOS archive manager yet.
name = "ouch"
version = "0.8.2"
description = "Painless compression/decompression in the terminal — handles tar, zip, 7z, gz, xz, bz, lz4, zstd and more through one interface (upstream: ouch-org/ouch, MIT licensed). Packaged here because MITOS has no custom archive manager yet."
category = "applications"
channel = "community"
inherits = "cargo"

[source]
git = "https://github.com/ouch-org/ouch"
rev = "0.8.2"

# build.steps left empty — inherits recipes/applications/cargo.toml,
# which is sufficient: ouch is a plain single-binary crate at its
# repository root (unlike helix — see that recipe for the contrast).

# Uncomment once a community signer is registered — see keys/README.md:
# signer = "community-<handle>"
