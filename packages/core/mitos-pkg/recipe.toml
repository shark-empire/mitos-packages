name = "mitos-pkg"
version = "0.1.0"
description = "MITOS's package manager and mitos-pkgd background daemon — the tool that installs everything else in this repository."
category = "core"
channel = "stable"
inherits = "cargo"

[source]
git = "https://github.com/shark-empire/mitos-pkg"
rev = "main"

# build.steps is intentionally left empty: this recipe inherits its
# steps from recipes/core/cargo.toml (see that file, and
# recipes/README.md for how inheritance resolves). Give this recipe its
# own [build] steps here instead if this package needs something the
# shared template doesn't cover (e.g. a codegen step before `cargo build`).


# Uncomment once this package has a maintainer signing key on file (see
# keys/README.md) and CI is set up to sign it during publish:
# signer = "mitos-release"
